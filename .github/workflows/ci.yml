name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Only the newest push to a branch holds a runner. Two Windows jobs running at
# once sat for forty minutes on a step that takes under a minute on its own, and
# an older run's result is not wanted anyway once a newer commit exists.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      # The pure maths, with no browser and no Electron.
      - name: The player's maths
        run: npm run test:harness

      # A harness that cannot fail is not evidence. This proves it can.
      - name: And prove those checks can fail
        run: npm run test:harness:control

      - name: Nothing native ships inside the app
        run: npm run test:no-native

      - run: npm run typecheck

      - run: npm run build:code -w tva-player

      # The app itself, launched the way Windows launches it. Chromium needs a
      # display even to run headless Electron, hence xvfb.
      - name: The app, launched and driven
        run: xvfb-run -a node scripts/app-harness.mjs

      - name: And prove those checks can fail
        run: xvfb-run -a node scripts/app-harness.mjs --negative-control

      # THE PACKAGED APP, which is not the same thing as the source folder.
      # Packaging puts everything in an asar archive and changes how files are
      # found inside it, so the protocol that serves the page, the worklet
      # loaded by URL and the copied-in stretch library all have to be proved
      # again on the other side of it.
      - name: Package it
        run: npx electron-builder --linux dir --publish never
        working-directory: apps/desktop

      - name: The packaged app, launched and driven
        run: xvfb-run -a node scripts/installed-harness.mjs

      # THE PHONE BUILD IS THE SAME RENDERER, so it is checked the same way: at
      # 390 pixels, with a real song and a real microphone signal, and with the
      # phone stylesheet taken away to prove the layout checks can fail.
      - name: The phone build, at the size of a phone
        run: |
          npx playwright install --with-deps chromium
          node scripts/build-android.mjs
          xvfb-run -a node scripts/phone-harness.mjs

      - name: And prove those checks can fail
        run: xvfb-run -a node scripts/phone-harness.mjs --negative-control

  # The Android app itself. Separate from the checks job because it needs the
  # Android SDK, and separate from Windows because it has nothing to do with it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      # NOT android-actions/setup-android. That action asks the SDK manager for
      # a package called 'tools', which Google removed years ago, so it fails on
      # the spot with "Failed to find package 'tools'" and nothing is built. The
      # runner image already carries the whole SDK; all this does is accept the
      # licences and make sure the two pieces this build names are present.
      - name: The Android SDK the build asks for
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMD="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$CMD" ] || CMD=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $CMD"
          yes | "$CMD" --licenses > /dev/null || true
          "$CMD" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - name: Build the web half
        run: node scripts/build-android.mjs

      - name: Put it into the Android project
        run: npx cap sync android
        working-directory: apps/android

      # An .exe Ted can run and an .apk he can tap are the same kind of thing:
      # something to install without a store in the way. Debug-signed, because a
      # release build needs a keystore and Android will not install an unsigned
      # one at all.
      # THE ONE PART OF THE ANDROID CODE A BUILD RUNNER CAN RUN. Serving a song
      # out of the phone's storage is what failed the first time Ted tried it,
      # so the decisions inside it live in a plain Java class with no Android in
      # it, and these put the awkward cases through them on every build.
      - name: The Android logic that can be run without a phone
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: apps/android/android

      - name: Build the app
        run: ./gradlew --no-daemon assembleDebug
        working-directory: apps/android/android

      # AN APP ANDROID WILL LET HIM INSTALL OVER THE LAST ONE.
      #
      # Android refuses a build signed by a different key than the copy already
      # on the phone, and it refuses with "Installation cancelled" and no reason
      # given. That is what Ted got, because there was no key in the project at
      # all: the Android build then makes a throwaway one on whatever machine is
      # running, and a build runner is a fresh machine every time. Every build
      # was a stranger to the one before it. The app was perfect and uninstallable.
      #
      # So the key is now committed, and this proves the APK really carries it.
      # A check on the app's own behaviour could never have caught this, because
      # nothing about the app was wrong.
      - name: The app is signed with the one key that can update the last one
        working-directory: apps/android/android
        run: |
          EXPECT=63d5f4bdfb9a24d94619b957a324e1e774ab4f5fff7803eeabb3d622448f3bbc
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "signed by $GOT"

          # AND SIGNED EVERY WAY A PHONE MIGHT LOOK. Left to itself this build
          # signed with v2 alone, which is legal and installs on a plain
          # emulator — and is refused by several makers' own protections, with
          # no reason given. v1 is legacy and Android skips it at this minimum
          # SDK; v2 and v3 are the pair that matter.
          SCHEMES=$("$APKSIGNER" verify -v app/build/outputs/apk/debug/app-debug.apk)
          echo "$SCHEMES" | grep -E '^Verified using v[23] scheme'
          for want in v2 v3; do
            if ! echo "$SCHEMES" | grep -qE "^Verified using $want scheme.*: true"; then
              echo "FAIL the app is not signed with the $want scheme."
              echo "     Phones that check for it refuse the install and say only"
              echo "     'Installation cancelled'."
              exit 1
            fi
          done

          if [ "$GOT" != "$EXPECT" ]; then
            echo "FAIL the app is signed by a key Ted's phone has never seen."
            echo "     It will refuse to install over the copy he already has, and it"
            echo "     will say 'Installation cancelled' without saying why."
            echo "     expected $EXPECT"
            exit 1
          fi
          echo "ok   it will install over the copy already on the phone"

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: TVA-Player-android
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # THE APP, ON A PHONE.
  #
  # Everything above this runs the page in desktop Chromium at a phone-sized
  # window, and three faults reached Ted through exactly that gap: a microphone
  # that never opened because one permission was undeclared, a song from OneDrive
  # that would not load, and a layout nobody could scroll to the end of once
  # Android's text size was turned up. None of them was visible without Android
  # actually running the app — a browser has no Storage Access Framework, no
  # runtime permissions and no system font scale.
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      # /dev/kvm is root-owned on the runner image and the emulator needs it.
      # GitHub turned hardware-accelerated Android virtualisation on for the
      # standard Linux runners in April 2024, public repos included, so no
      # larger runner is needed — only permission to open the device.
      - name: Let the runner reach /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NOT android-actions/setup-android — same reason as the android job above.
      - name: The Android SDK the build asks for
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMD=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$CMD" --licenses > /dev/null || true
          "$CMD" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - name: Build the web half
        run: node scripts/build-android.mjs
      - name: Put it into the Android project
        run: npx cap sync android
        working-directory: apps/android

      # The same generator the Windows and phone checks use, so the song the
      # emulator opens is the same eight seconds they open. Generated rather
      # than committed: no audio belongs in git.
      - name: A song for the chooser to hand over
        run: |
          mkdir -p apps/android/android/app/src/androidTest/assets
          node -e "import('./scripts/make-test-song.mjs').then(m => m.makeMp3('apps/android/android/app/src/androidTest/assets/song.mp3', { seconds: 8 }))"
          ls -l apps/android/android/app/src/androidTest/assets

      # An emulator takes minutes to create and seconds to restore.
      - name: Keep the emulator between runs
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Make the phone once, for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot-load -camera-back none -camera-front none
          disable-animations: false
          script: echo "the phone exists"

      - name: The app, on a phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # google_apis, NOT google_apis_playstore. A Play image is a user build,
          # and a web view reads its command-line file only on a userdebug device
          # — which is the whole of how the fake microphone gets in. On a Play
          # image the recording check could not be run at all.
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -noaudio is in this action's own defaults and is left out here on
          # purpose: it takes the guest's audio device away, and the recorder is
          # an AudioWorklet inside an AudioContext that needs an output clock
          # before it will render anything. With it, the recording check fails
          # for a reason that has nothing to do with the app.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/on-a-phone.sh"

      - name: What the phone said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-results
          path: apps/android/android/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 14

  # The same on real Windows, and then the installed app — which is the only
  # thing Ted ever actually runs.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - run: npm run test:harness
      - run: npm run test:harness:control
      - run: npm run build:code -w tva-player

      - name: The app, launched and driven
        run: node scripts/app-harness.mjs
      - name: And prove those checks can fail
        run: node scripts/app-harness.mjs --negative-control

      - name: Build the installer
        run: npm run build -w tva-player

      # RUN THE INSTALLER. It had never once been run: CI built it and nobody
      # installed it, so an installer that failed would have shipped unnoticed.
      - name: Install it, the way Ted does
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer was produced.' }
          Write-Host "Running $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          # Found, not guessed. The first version hard-coded a path, guessed it
          # wrong, and reported an installer failure when the installer had
          # worked perfectly.
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $found = Get-ChildItem $programs -Recurse -Filter 'TVA Player.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $found) {
            Get-ChildItem $programs -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            throw 'The installer ran but no "TVA Player.exe" appeared under Programs.'
          }
          Write-Host "Installed at $($found.FullName)"

          # The folder it lands in is what Ted would see in Explorer, so it has
          # to read as the name of an app and not as an npm package.
          $folder = Split-Path $found.FullName -Leaf
          $parent = Split-Path (Split-Path $found.FullName -Parent) -Leaf
          Write-Host "Install folder: $parent"
          if ($parent -like '*@*') { throw "The install folder is named '$parent'." }

          # A one-click installer opens the app as soon as it finishes, which is
          # what Ted wants and is wrong here: the checks start their own copy
          # and the two would be fighting over the same app. Close it first.
          $running = Get-Process -Name 'TVA Player' -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host "The installer opened the app (pid $($running.Id -join ',')). Closing it."
            $running | Stop-Process -Force
            Start-Sleep -Seconds 2
          } else {
            Write-Host 'The installer did not leave the app running.'
          }

          "TVA_EXE=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: The INSTALLED app, launched and driven
        run: node scripts/installed-harness.mjs "$env:TVA_EXE"
        shell: pwsh

      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: TVA-Player-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  # ONE PAGE, TWO FILES, NO ZIP.
  #
  # An artifact on a build page is a zip that has to be downloaded, found and
  # unpacked — which on a phone means a file manager and three wrong turns
  # before anything is installed. A release asset is a direct download of the
  # file itself, at an address that never changes:
  #
  #   .../releases/latest/download/TVA-Player.apk
  #   .../releases/latest/download/TVA-Player-Setup.exe
  #
  # Bookmark either one and it is always the newest build. This runs only when
  # every check has passed, so the link can never point at a build that failed.
  publish:
    needs: [checks, android, windows, phone]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: TVA-Player-android, path: pickup/android }
      - uses: actions/download-artifact@v4
        with: { name: TVA-Player-installer, path: pickup/windows }

      - name: Name them plainly
        run: |
          mkdir -p out
          cp "$(ls pickup/android/*.apk | head -1)" "out/TVA-Player.apk"
          cp "$(ls pickup/windows/*.exe | head -1)" "out/TVA-Player-Setup.exe"
          ls -l out

      # A rolling pre-release rather than a version tag: this is "the newest
      # build", not a version anybody is depending on, and the download address
      # has to stay the same for a bookmark to be worth making.
      # NOT A PRE-RELEASE. /releases/latest resolves to the newest release that
      # is NOT marked pre-release, so marking it made the very address these
      # files exist for return 404 — while the release page itself looked
      # perfectly fine. Found by asking the link rather than by reading about it.
      - name: Put them where one tap reaches them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7}. Every check passed.

          **Phone:** tap **TVA-Player.apk** below. Android asks once whether to allow
          installing from this source — say yes, then tap the download again.

          **Windows:** download **TVA-Player-Setup.exe** and run it over the top of
          what you have. Your settings stay."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$NOTES" \
              --prerelease=false --latest
            gh release upload latest out/TVA-Player.apk out/TVA-Player-Setup.exe --clobber
          else
            gh release create latest out/TVA-Player.apk out/TVA-Player-Setup.exe \
              --title "Latest build" --notes "$NOTES" --latest
          fi

      # ASK THE LINK. The whole point of a release is one address that hands over
      # the app, and the first one built returned 404 at exactly that address
      # because of a flag — so the build now downloads its own links and looks at
      # the first two bytes. An APK is a zip and begins PK; a Windows program
      # begins MZ. Anything else and this fails rather than being sent to
      # somebody to find out for themselves.
      - name: Prove the links really hand over the app
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          fail=0
          for pair in "TVA-Player.apk:PK" "TVA-Player-Setup.exe:MZ"; do
            name="${pair%%:*}"; want="${pair##*:}"
            got=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' "$base/$name" || echo 000)
              if [ "$code" = "200" ]; then
                got=$(curl -sL --range 0-1 "$base/$name" | head -c 2)
                break
              fi
              echo "$name answered $code, waiting..."
              sleep 6
            done
            if [ "$got" = "$want" ]; then
              echo "ok  $name is served from $base and starts $want"
            else
              echo "FAIL $name at $base/$name gave '"'"'$got'"'"', wanted '"'"'$want'"'"'"
              fail=1
            fi
          done
          [ "$fail" = "0" ]
