apply plugin: 'com.android.application'

android {
    namespace "com.tedsvoiceacademy.player"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tedsvoiceacademy.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ONE KEY, FOR EVER, KEPT IN THE REPO.
     *
     * Android will not install a build over a copy signed by a different key.
     * It refuses with "Installation cancelled" and no reason given, which is
     * exactly what Ted saw, and it happened because there was no key here at
     * all: left to itself the Android build makes a throwaway key on whatever
     * machine it is running on, and a build runner is a fresh machine every
     * time. So every build was signed by a stranger to the one before it, and
     * no build could ever update the last one. The app worked perfectly and
     * could not be installed.
     *
     * This is a DEBUG key, on purpose, with the passwords Android itself uses
     * for debug keys. It is in the repo because the alternative is Ted
     * uninstalling the app before every update and losing his settings with it.
     * What it protects: nothing. What it does: makes this app the same app from
     * one build to the next, which is the whole of what Android is asking for.
     * A store release would need a real key, kept out of here.
     */
    signingConfigs {
        debug {
            storeFile file('../tva-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            /* EVERY SCHEME, NOT JUST THE ONE ANDROID MINIMALLY ACCEPTS.
             *
             * Left to itself this build signed with v2 alone — no v1, no v3.
             * That is legal, and it installs on a plain emulator, which is
             * exactly why it went unnoticed. Real phones are fussier: several
             * makers' own protections refuse a sideloaded app that is not
             * signed every way they know how to check, and they refuse it the
             * way Ted saw — "Installation cancelled", with no reason given.
             * Signing all three costs nothing and removes a whole class of
             * phone-specific refusals. */
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            /* Said out loud rather than left to the default, because a check
               depends on it: WebView reads its command-line file only for a
               debuggable app or on a userdebug device, and that file is how the
               emulator gets a microphone to hand the page. */
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        animationsDisabled = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MediaSessionCompat, MediaButtonReceiver and the media-style notification —
    // the lock-screen controls, and the standing the app needs for Android to
    // leave the page playing with the screen off.
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // Standing in for the one part of opening a song that a build runner cannot
    // do: a person tapping a file in Android's chooser. Everything after the
    // chooser stays the code that ships.
    androidTestImplementation "androidx.test.espresso:espresso-intents:$androidxEspressoCoreVersion"
    // GrantPermissionRule lives in :rules. ActivityLifecycleMonitorRegistry, which
    // is how the tests find the running activity without ActivityScenario, is in
    // :runner.
    androidTestImplementation "androidx.test:core:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test:rules:$androidxTestRulesVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    // FileProvider, for handing the test's own song to the stubbed chooser as a
    // real content:// address. Named here rather than leaned on through the
    // app's own dependencies, so a reshuffle of those cannot quietly break the
    // tests.
    androidTestImplementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
