name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      # The pure maths, with no browser and no Electron.
      - name: The player's maths
        run: npm run test:harness

      # A harness that cannot fail is not evidence. This proves it can.
      - name: And prove those checks can fail
        run: npm run test:harness:control

      - name: Nothing native ships inside the app
        run: npm run test:no-native

      - run: npm run typecheck

      - run: npm run build:code -w @tva/desktop

      # The app itself, launched the way Windows launches it. Chromium needs a
      # display even to run headless Electron, hence xvfb.
      - name: The app, launched and driven
        run: xvfb-run -a node scripts/app-harness.mjs

      - name: And prove those checks can fail
        run: xvfb-run -a node scripts/app-harness.mjs --negative-control

  # The same end-to-end run on real Windows, which is the only place the file
  # associations, the registry and the installer actually mean anything.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:harness
      - run: npm run test:harness:control
      - run: npm run build:code -w @tva/desktop

      # The whole app, driven on real Windows: a real MP3 opened, the practice
      # engine measured, a take recorded from a known tone and read back.
      - run: node scripts/app-harness.mjs
      - run: node scripts/app-harness.mjs --negative-control

      # Build the installer on every push, not only on a tagged release, and
      # leave it attached to the run. Ted can download and install the current
      # state of the app at any time without anybody tagging anything — which
      # matters because the things only his own machines can prove (the
      # SmartScreen path, the file associations, double-clicking a song in
      # Explorer) are the ones nothing here can check.
      - name: Build the installer
        run: npm run build -w @tva/desktop

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: TVA-Player-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
